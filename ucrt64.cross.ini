[binaries]
c = 'x86_64-w64-mingw32ucrt-gcc'
cpp = 'x86_64-w64-mingw32ucrt-g++'
ar = 'x86_64-w64-mingw32ucrt-ar'
windres = 'x86_64-w64-mingw32ucrt-windres'
strip = 'x86_64-w64-mingw32ucrt-strip'
exe_wrapper = 'wine'

[built-in options]
c_args = 				[ '-v', '-std=c99', '-mcrtdll=ucrtbase', '-march=x86-64-v2', '-mtune=generic', '-mwindows', '-mwin32', '-fwritable-relocated-rdata', '-mpe-aligned-commons' ]
c_link_args = 	[ '-v', '-std=c99', '-mcrtdll=ucrtbase', '-march=x86-64-v2', '-mtune=generic', '-mwindows', '-mwin32', '-fwritable-relocated-rdata', '-mpe-aligned-commons' ]
cpp_args = 			[ '-v', '-std=c++17', '-mcrtdll=ucrtbase', '-march=x86-64-v2', '-mtune=generic', '-mwindows', '-mwin32', '-fwritable-relocated-rdata', '-mpe-aligned-commons', '-Wp,-D_FORTIFY_SOURCE=2', '-fstack-protector-strong', '-Wl,-static,-lssp' ]
cpp_link_args = [ '-v', '-std=c++17', '-mcrtdll=ucrtbase', '-march=x86-64-v2', '-mtune=generic', '-mwindows', '-mwin32', '-fwritable-relocated-rdata', '-mpe-aligned-commons', '-Wp,-D_FORTIFY_SOURCE=2', '-fstack-protector-strong', '-Wl,-static,-lssp' ]
b_lto = true
b_lto_threads = 8

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
kernel = 'nt'

[properties]
sys_root = '/usr/windows/ucrt64'
needs_exe_wrapper = true
pkg_config = '/usr/bin/pkg-config --define-prefix --env-only'
pkg_config_path = sys_root+'/lib/pkgconfig:'+ sys_root+'/share/pkgconfig'
c_std = 'c11'
cpp_std = 'c++17'
