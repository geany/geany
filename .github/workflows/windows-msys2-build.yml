name: Windows/MSYS2 Build
on:
  push:
    branches:
      - master
    tags:
      - '[0-9]**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: 'Sign artifacts'
        required: false
        type: boolean

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 1G

jobs:
  msys2-mingw64:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        build-tool: [autotools, meson]
        arch: [x86_64, arm64]
        include:
          # Windows x64: UCRT64 environment with GCC
          - arch: x86_64
            runner: windows-latest
            msystem: UCRT64
            pkg-prefix: mingw-w64-ucrt-x86_64
            compiler-pkg: gcc
            cc: gcc
            cxx: g++
            bundle-abi: --ucrt64
            # empty to keep the existing cache keys and artifact names
            suffix: ''
          # Windows on ARM64: CLANGARM64 environment with Clang (there is no GCC)
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg-prefix: mingw-w64-clang-aarch64
            compiler-pkg: clang
            cc: clang
            cxx: clang++
            bundle-abi: --clangarm64
            suffix: '-arm64'
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: sccache ${{ matrix.cc }}
      CXX: sccache ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # NSIS is not available for ARM64, the x64 one runs fine under
          # emulation and produces the same (x86) installer either way
          install: |
            ${{ matrix.pkg-prefix }}-${{ matrix.compiler-pkg }}
            ${{ matrix.pkg-prefix }}-${{ matrix.build-tool }}
            ${{ matrix.build-tool == 'meson' && format('{0}-jq', matrix.pkg-prefix) || '' }}
            ${{ matrix.pkg-prefix }}-sccache
            ${{ matrix.pkg-prefix }}-gtk3
            ${{ matrix.pkg-prefix }}-python-docutils
            patch
            rsync
            unzip
            dos2unix
            mingw-w64-ucrt-x86_64-nsis
      # build the GTK bundle, but cache it for a week
      - name: Cache timestamp for GTK-Bundle
        id: cache_gtk_bundle_timestamp
        # we use a Monday-based weekly cache, so it usually doesn't change
        # right before a release, as we usually do them on Sundays.
        run: echo "timestamp=$(date +%Y-%W)" >> $GITHUB_OUTPUT
      - name: Cache GTK-Bundle
        id: cache_gtk_bundle
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/geany_build/bundle/geany-gtk
          key: ${{ runner.os }}-${{ github.job }}${{ matrix.suffix }}-bundle-geany-gtk-${{ hashFiles('scripts/gtk-bundle-from-msys2.sh') }}-${{ steps.cache_gtk_bundle_timestamp.outputs.timestamp }}
      - name: GTK-Bundle
        if: steps.cache_gtk_bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p geany_build/bundle/geany-gtk
          cd geany_build/bundle/geany-gtk
          bash $(cygpath -u "${GITHUB_WORKSPACE}")/scripts/gtk-bundle-from-msys2.sh -3 ${{ matrix.bundle-abi }}

      - name: Configure sccache
        uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-${{ github.job }}${{ matrix.suffix }}-${{ matrix.build-tool }}-sccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ github.job }}${{ matrix.suffix }}-${{ matrix.build-tool }}-sccache-

      - name: Prepare Build environment
        run: |
          echo "DESTINATION=$(cygpath -u "${GITHUB_WORKSPACE}")/geany_build" >> $GITHUB_ENV
      - name: Build (Autotools)
        if: matrix.build-tool == 'autotools'
        run: |
          echo "VERSION=$(autom4te --no-cache --language=Autoconf-without-aclocal-m4 --trace AC_INIT:\$2 configure.ac)" >> $GITHUB_ENV
          NOCONFIGURE=1 ./autogen.sh
          export lt_cv_deplibs_check_method=${lt_cv_deplibs_check_method='pass_all'}
          mkdir -p _build
          cd _build
          ../configure --prefix=${DESTINATION}/build/geany --disable-silent-rules
          make -j
          make install
      - name: Build (Meson)
        if: matrix.build-tool == 'meson'
        run: |
          echo "VERSION=$(meson introspect --projectinfo meson.build | jq -r .version)" >> $GITHUB_ENV
          meson setup --prefix=${DESTINATION}/build/geany _build .
          meson compile -C _build
          meson install -C _build
      - name: Compile NSIS
        run: |
          mkdir -p ${DESTINATION}/release/geany-orig
          rsync -a --delete ${DESTINATION}/build/geany/ ${DESTINATION}/release/geany-orig
          # on ARM64, makensis comes from the x64 UCRT64 package (appended so
          # that the native tools, e.g. strip, still take precedence)
          command -v makensis >/dev/null || export PATH="${PATH}:/ucrt64/bin"
          python scripts/msys2-geany-release.py ${VERSION}

      # Test the resulting installer.  We use cmd.exe as the shell because the
      # installer doesn't seem to love MSYS2 for some reason.
      - name: Test NSIS
        shell: cmd
        run: |
          ECHO ON
          SET DESTINATION=%GITHUB_WORKSPACE%\geany_install
          start "geany-%VERSION%_setup.exe" /wait %GITHUB_WORKSPACE%\geany_build\geany-%VERSION%_setup.exe /S /D=%DESTINATION%
          IF NOT EXIST "%DESTINATION%\uninst.exe" EXIT /B 1
          IF NOT EXIST "%DESTINATION%\bin\geany.exe" EXIT /B 1
          IF NOT EXIST "%DESTINATION%\lib\geany\export.dll" EXIT /B 1
          IF EXIST "%DESTINATION%\lib\geany\demoplugin.dll" EXIT /B 1
      - name: Test installed Geany
        shell: cmd
        run: |
          %GITHUB_WORKSPACE%\geany_install\bin\geany.exe --version
      - name: Test NSIS uninstaller
        shell: cmd
        run: |
          ECHO ON
          SET DESTINATION=%GITHUB_WORKSPACE%\geany_install
          start "uninst" /wait %DESTINATION%\uninst.exe /S
          REM it seems the uninstaller returns earlier than the files are actually removed, so wait a moment
          ping -n 10 127.0.0.1 >NUL
          IF EXIST "%DESTINATION%" EXIT /B 1

      - name: Upload Unsigned Artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: geany-unsigned${{ matrix.suffix }}${{ matrix.build-tool != 'autotools' && format('-{0}', matrix.build-tool) || '' }}
          path: geany_build/*.exe
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: sccache statistics
        run: sccache --show-stats

      - name: SignPath Signing
        id: sign-artifact
        uses: signpath/github-action-submit-signing-request@v2
        # Only sign artifacts on tags (only x64 for now, as the signing policy
        # and the release process only know about that installer)
        if: matrix.build-tool == 'autotools' && matrix.arch == 'x86_64' && (inputs.sign_artifacts || startsWith(github.ref, 'refs/tags/'))
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'geany'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: geany-signed
      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v7
        if: steps.sign-artifact.outcome == 'success'
        with:
          name: geany-signed
          path: geany-signed
          retention-days: 3
          overwrite: true
          if-no-files-found: error
