# based on JavaScript file
# For complete documentation of this file, please see Geany's main documentation
#
# QML is JavaScript inside a declarative shell, so this borrows the
# JavaScript lexer and adds QML's own keywords and value types.
[styling=C]

[keywords]
# all items must be in one line
primary=break case catch class const continue debugger default delete do else enum export extends false finally for function get if import in Infinity instanceof let NaN new null return set static super switch this throw true try typeof undefined var void while with yield async await from as property signal readonly required alias pragma component on
secondary=bool int real double string url color date variant var list point size rect font vector2d vector3d vector4d quaternion matrix4x4 Array Boolean Date Function Math Number Object String RegExp Error JSON Qt console parseFloat parseInt isNaN isFinite

[lexer_properties=C]
# template strings
lexer.cpp.backquoted.strings=1

[settings]
# default extension used when saving files
extension=qml
lexer_filetype=Javascript
tag_parser=Javascript

# MIME type
mime_type=text/x-qml

# single comments, like # in this file
comment_single=//
# multiline comments
comment_open=/*
comment_close=*/

# set to false if a comment character/string should start at column 0 of a line, true uses any
# indentation of the line, e.g. setting to true causes the following on pressing CTRL+d
# 		#command_example();
# setting to false would generate this
# #		command_example();
# This setting works only for single line comments
comment_use_indent=true

# context action command (please see Geany's main documentation for details)
context_action_cmd=

[indentation]
#width=4
# 0 is spaces, 1 is tabs, 2 is tab & spaces

[build-menu]
# %f will be replaced by the complete filename
# %e will be replaced by the filename without extension
#FT_00_LB=_Lint
#FT_00_CM=qmllint "%f"
#FT_00_WD=
